<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitmon - sign in</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% include '_icons.html' %}
<div class="login panel">
    <h1>
        <svg class="icon" width="24" height="24"><use href="#icon-pulse"/></svg>
        <span>Fitmon <small style="font-size: 0.5em; color: #666;">v{{ version }}</small></span>
    </h1>
    <div id="insecure" class="banner" style="display:none">
        This page is on plain HTTP, where browsers discard the login cookie, so sign-in is refused here. Use the HTTPS (Tailscale) address - or, if this browser is on the machine that runs fitmon, <a id="insecure-local" href="http://localhost:8640/login">open http://localhost:8640</a>.
    </div>
    <form id="login-form">
        <label class="field"><span>Username</span><input id="login-username" autocomplete="username" required autofocus></label>
        <label class="field"><span>Password</span><input id="login-password" type="password" autocomplete="current-password" required></label>
        <label class="row" style="margin-bottom:12px"><input id="login-remember" type="checkbox" checked> Remember me in this browser (90 days)</label>
        <button class="primary" type="submit">Sign in</button>
        <p id="login-error" class="down"></p>
    </form>
    <p class="muted">Accounts are by invitation.</p>
</div>
<script>
const local = ['localhost', '127.0.0.1'].includes(location.hostname);
if (location.protocol !== 'https:' && !local) {
    document.getElementById('insecure').style.display = '';
    const link = document.getElementById('insecure-local');      // keep whatever port we are served on
    link.href = `http://localhost:${location.port || 80}/login`;
    link.textContent = `open http://localhost:${location.port || 80}`;
}
document.getElementById('login-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const err = document.getElementById('login-error');
    err.textContent = '';
    const resp = await fetch('/api/auth/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: document.getElementById('login-username').value,
            password: document.getElementById('login-password').value,
            remember: document.getElementById('login-remember').checked,
        })});
    if (resp.ok) { location.href = '/'; return; }
    const body = await resp.json().catch(() => ({}));
    err.textContent = body.error === 'too_many_attempts' ? `Too many attempts. Try again in ${body.retry_after} s.`
        : body.error === 'https_required' ? body.message : 'Wrong username or password.';
});
</script>
</body>
</html>
