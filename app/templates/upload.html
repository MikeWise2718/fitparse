{% extends "base.html" %}

{% block content %}
<h1 class="mb-4">Upload FIT Files</h1>

<div class="row">
    <div class="col-lg-6">
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Upload Files</h5>
            </div>
            <div class="card-body">
                <form action="{{ url_for('upload.upload_file') }}" method="post" enctype="multipart/form-data" id="uploadForm">
                    <div class="upload-area p-5 border border-2 border-dashed rounded text-center mb-3" id="dropZone">
                        <input type="file" name="files[]" id="fileInput" multiple accept=".fit" class="d-none">
                        <div class="upload-message">
                            <p class="mb-2">Drag & drop .fit files here</p>
                            <p class="text-muted mb-3">or</p>
                            <button type="button" class="btn btn-outline-primary" onclick="document.getElementById('fileInput').click()">
                                Browse Files
                            </button>
                        </div>
                        <div id="fileList" class="mt-3"></div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="uploadBtn" disabled>Upload Files</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Scan Local Directory</h5>
            </div>
            <div class="card-body">
                <form action="{{ url_for('upload.scan_directory') }}" method="post">
                    <div class="mb-3">
                        <label for="directory" class="form-label">Directory Path</label>
                        <input type="text" class="form-control" id="directory" name="directory"
                               placeholder="Enter full path to folder with .fit files">
                        <div class="form-text">
                            Enter the full path to a folder containing .fit files (e.g., C:\Users\username\Garmin)
                        </div>
                    </div>
                    <button type="submit" class="btn btn-secondary">Scan Directory</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const uploadBtn = document.getElementById('uploadBtn');

    // Drag and drop handling
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.add('border-primary'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.remove('border-primary'), false);
    });

    dropZone.addEventListener('drop', handleDrop, false);
    fileInput.addEventListener('change', updateFileList);

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        fileInput.files = files;
        updateFileList();
    }

    function updateFileList() {
        const files = fileInput.files;
        fileList.innerHTML = '';

        if (files.length > 0) {
            const list = document.createElement('ul');
            list.className = 'list-unstyled text-start';

            for (let i = 0; i < files.length; i++) {
                const li = document.createElement('li');
                li.className = 'small text-muted';
                li.textContent = files[i].name;
                list.appendChild(li);
            }

            fileList.appendChild(list);
            uploadBtn.disabled = false;
        } else {
            uploadBtn.disabled = true;
        }
    }
});
</script>
{% endblock %}
