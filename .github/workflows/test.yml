# Lint (hard errors only) and both test suites: the fitparse library's unittest suite and
# fitmon's pytest suite. Python 3.12 is the minimum (garminconnect 0.3.x), 3.13 what munchlax
# runs. Installs with uv from uv.lock, like every other environment of this project.
#
# Replaced the upstream workflow on 2026-11-01 (specs/ci-workflow-fix.md): its 3.7-3.11 matrix
# no longer installed, so every run since 2026-09-19 failed before testing anything.

name: test

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'specs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'specs/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    # setup-uv publishes no floating major tag, so it is pinned to a release.
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install
      run: uv sync --locked

    - name: Lint (syntax errors and undefined names)
      run: uvx ruff check --select E9,F63,F7,F82 .

    - name: fitparse library tests
      run: uv run python -m unittest discover -s tests

    - name: fitmon tests
      run: uv run pytest -q
